[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "1.0.0"
description = "Fast full-text search engine in Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Oleksii Boiko", email = "boikoalex05@gmail.com" }
]
dependencies = [
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "pyright>=1.1.350",
    "ruff>=0.3.0",
]

[project.scripts]
findex = "findex.cli:app"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]